<head>

<script>
/* =====================================================================
   NOTES DE DÉPART (bulletin du semestre 1, édité le 04/11/2026).
   Le site enregistre ensuite tes saisies dans ton navigateur : tu n'as
   pas besoin de modifier ce fichier pour ajouter des notes.
   Un module : ref, nom, coef (coefficient du bulletin),
   promo { moy, min, max } (facultatif), notes [ { t, n, sur, coef } ].
   ===================================================================== */
const DEFAUT = {
  eleve: "Lucas Boutin",
  formation: "Icam Vendée · A2 apprentissage · promo 2030",
  semestre: "Semestre 1 – 2026/2027",
  modules: [
    { ref: "A2.CRSA.HUM.COM",   nom: "Culture générale et expression", coef: 6, notes: [] },
    { ref: "A2.CRSA.HUM.FH",    nom: "Formation Humaine",           coef: 6,    notes: [] },
    { ref: "A2.CRSA.GM",        nom: "Génie mécanique",             coef: 18,   notes: [] },
    { ref: "A2.CRSA.GE",        nom: "Génie électrique",            coef: 18,   notes: [] },
    { ref: "A2.CRSA.HUM.LV",    nom: "Langues Vivantes",            coef: 10,   promo: { moy: 7.30, min: 0, max: 18.70 },
      notes: [ { t: "Anglais", n: 15.30, sur: 20, coef: 1 } ] },
    { ref: "A2.CRSA.MIA.MATHS", nom: "Mathématiques",               coef: 12.5, notes: [] },
    { ref: "A2.CRSA.MEO.GI",    nom: "Organisation industrielle",   coef: 5,    promo: { moy: 15.80, min: 13, max: 18 },
      notes: [ { t: "Organisation industrielle", n: 14, sur: 20, coef: 1 } ] },
    { ref: "A2.CRSA.PPR",       nom: "Projet",                      coef: 9,    notes: [] },
    { ref: "A2.CRSA.MIA.PHY",   nom: "Sciences physiques",          coef: 12.5, promo: { moy: 10.71, min: 1.67, max: 20 }, notes: [] },
    { ref: "A2.CRSA.MEO.VE",    nom: "Vie et gestion d'entreprise", coef: 3,    notes: [] }
  ]
};
</script>
<style>
/* Layout : page de cahier (marge rose, lignes bleues) ; en-tête avec la moyenne du semestre, deux onglets, modules l'un après l'autre dans l'ordre du portail. */
:root {
  --paper: #fafbfe;
  --surface: #ffffff;
  --ink: #181d3a;
  --muted: #5b6283;
  --rule: #dfe4f2;
  --rule-strong: #c4cbe3;
  --margin: #e0718a;
  --accent: #2a3dbf;
  --accent-soft: #e8ebfb;
  --bad: #c3301d;
  --good: #1d7650;
  --range-fill: rgba(235, 104, 52, .16); --range-stroke: rgba(235, 104, 52, .55);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11142a; --surface: #181c36; --ink: #e9ebf7; --muted: #9ba1c5;
    --rule: #252a4a; --rule-strong: #363c66; --margin: #c25a75;
    --accent: #8d9bff; --accent-soft: #232a58; --bad: #ff7d69; --good: #5ccf98;
    --range-fill: rgba(217, 89, 38, .22); --range-stroke: rgba(217, 89, 38, .6);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11142a; --surface: #181c36; --ink: #e9ebf7; --muted: #9ba1c5;
  --rule: #252a4a; --rule-strong: #363c66; --margin: #c25a75;
  --accent: #8d9bff; --accent-soft: #232a58; --bad: #ff7d69; --good: #5ccf98;
  --range-fill: rgba(217, 89, 38, .22); --range-stroke: rgba(217, 89, 38, .6);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* En-tête */
.head {
  position: relative; padding: 28px 0 20px 28px; display: grid; gap: 16px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}
.head::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .7; }
.head h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.05; }
.who { color: var(--muted); }
.general { display: grid; gap: 2px; }
.general .big { font-family: var(--font-data); font-size: clamp(46px, 10vw, 68px); font-weight: 500; line-height: 1; color: var(--accent); }
.general .big small { font-size: .36em; color: var(--muted); margin-left: 4px; }
.general .sub { font-size: 14px; color: var(--muted); }

/* Onglets */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule-strong); }
.tabs a {
  padding: 10px 16px; text-decoration: none; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a:hover { color: var(--ink); }

section { display: grid; gap: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }

/* Formulaire d'ajout */
.add { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 10px; padding: 16px; }
.add h2 { font-size: 20px; }
.add form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) repeat(3, minmax(0, 0.8fr)) auto; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--paper);
}
.btn {
  padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
  font-weight: 600; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn:hover { filter: brightness(1.08); }
.msg { min-height: 1.5em; font-size: 14px; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.msg.err { color: var(--bad); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }

/* Modules */
.modules { display: grid; gap: 0; border-top: 1px solid var(--rule-strong); }
.mod { padding: 16px 4px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.mod-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.mod-head > div { min-width: 0; }
.mod .ref { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.mod h3 { font-size: 19px; }
.mod .meta { font-size: 13px; color: var(--muted); }
.mod-avg { text-align: right; flex-shrink: 0; }
.mod-avg .v { font-family: var(--font-data); font-size: 26px; font-weight: 500; line-height: 1.1; }
.mod-avg .v.none { color: var(--muted); font-size: 20px; }
.mod-avg .v.lo { color: var(--bad); }
.mod-avg .promo { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.notes { display: grid; gap: 6px; }
.note-row { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem 1.2rem 4.5rem 6.5rem 5.5rem 2rem; gap: 6px; align-items: center; }
.note-row input {
  width: 100%; padding: 5px 8px; border: 1px solid transparent; border-radius: 5px; background: var(--accent-soft);
}
.note-row input:hover { border-color: var(--rule-strong); }
.note-row input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.note-row input.num { text-align: right; }
.note-row .sep, .note-row .cl { font-size: 13px; color: var(--muted); }
.note-row .sep { text-align: center; }
.note-row .cl { text-align: right; }
.s20 { font-family: var(--font-data); font-size: 13px; color: var(--accent); white-space: nowrap; }
.s20.lo { color: var(--bad); }
.preview { margin: 0; font-size: 14px; color: var(--muted); min-height: 1.4em; }
.del { width: 2rem; height: 2rem; border: 0; background: transparent; color: var(--muted); border-radius: 5px; cursor: pointer; font-size: 18px; line-height: 1; }
.del:hover { color: var(--bad); background: var(--accent-soft); }
.empty { color: var(--muted); font-style: italic; font-size: 14px; margin: 0; }
.title-row { display: flex; align-items: center; gap: 10px; }
.plus {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--accent);
  background: transparent; color: var(--accent); font-size: 18px; font-weight: 600; line-height: 1; cursor: pointer;
  display: inline-grid; place-items: center; padding: 0;
}
.plus:hover, .plus[aria-expanded="true"] { background: var(--accent); color: var(--paper); }
.new-note { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--accent); border-radius: 8px; }
.new-note .note-row input { background: var(--surface); border-color: var(--rule-strong); }
.new-actions { display: flex; gap: 14px; align-items: center; }
.btn.small { padding: 6px 12px; font-size: 14px; }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools .hint { flex-basis: 100%; }

/* Graphiques */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.card h2 { font-size: 20px; }
.card svg { display: block; width: 100%; height: auto; overflow: visible; }
.card svg text { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
.card svg .val { fill: var(--ink); font-size: 12px; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw-line { width: 18px; height: 0; border-top: 2px solid; }
.sw-dot { width: 10px; height: 10px; border-radius: 50%; }
.sw-rect { width: 12px; height: 14px; border-radius: 2px; background: var(--range-fill); border: 1px solid var(--range-stroke); }
.sw-dot { box-sizing: border-box; }
.radar-wrap { display: grid; justify-items: center; }
.radar-wrap svg { max-width: 460px; }
.chart-scroll { overflow-x: auto; }
.chart-scroll svg { min-width: 520px; }
.pie-wrap { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: center; }
.pie-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pie-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.pie-legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.pie-legend .v { font-family: var(--font-data); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; }

@media (max-width: 720px) {
  .add form { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .add form .f-module, .add form .f-titre { grid-column: 1 / -1; }
  .add form .btn { grid-column: 1 / -1; }
  .pie-wrap { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .pie-wrap svg { max-width: 280px; }
  .pie-legend { width: 100%; }
}
@media (max-width: 480px) {
  .note-row { grid-template-columns: minmax(0, 1fr) 4.2rem 1rem 3.4rem 4.6rem 2rem; gap: 4px; }
  .note-row .s20 { grid-column: 1 / -1; grid-row: 2; text-align: right; padding-right: 2.4rem; }
  .note-row .s20:empty { display: none; }
  .note-row .cl { font-size: 11px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>Mes notes</h1>
      <div class="who" id="who"></div>
    </div>
    <div class="general">
      <span class="label" id="sem-label"></span>
      <span class="big" id="general"></span>
      <span class="sub" id="general-sub"></span>
    </div>
  </header>

  <nav class="tabs" aria-label="Onglets">
    <a href="#notes" id="tab-notes">Notes</a>
    <a href="#graphiques" id="tab-graphiques">Graphiques</a>
  </nav>

  <main id="view"></main>

  <footer>Calcul : chaque note est ramenée sur 20, la moyenne d'un module tient compte du coefficient de chaque note, puis la moyenne du semestre tient compte du coefficient de chaque module. Les modules sans note ne comptent pas.</footer>
</div>

<script>
(() => {
  const CLE = "mes-notes-icam-v1";
  const copie = o => JSON.parse(JSON.stringify(o));
  let data;
  try { data = JSON.parse(localStorage.getItem(CLE)); } catch (e) {}
  if (!data || !Array.isArray(data.modules)) data = copie(DEFAUT);
  // Les noms des modules suivent toujours ceux du fichier (ex. un module renommé)
  data.modules.forEach(m => { const d = DEFAUT.modules.find(x => x.ref === m.ref); if (d) m.nom = d.nom; });
  const save = () => { try { localStorage.setItem(CLE, JSON.stringify(data)); } catch (e) {} };

  const fmt = (x, dec = 2) => x == null ? "—" : x.toLocaleString("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const fmtN = x => x.toLocaleString("fr-FR", { maximumFractionDigits: 2 });
  const parse = s => { const v = parseFloat(String(s).replace(",", ".").trim()); return Number.isFinite(v) ? v : null; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const code = m => m.ref.split(".").pop();
  // Conversion sur 20 : note / barème × 20
  const sur20 = (n, sur) => n != null && sur > 0 ? n / sur * 20 : null;
  const s20 = (n, sur) => { const v = sur20(n, sur); return `<span class="s20 ${v != null && v < 10 ? "lo" : ""}">${v == null || sur === 20 ? "" : `= ${fmt(v)}/20`}</span>`; };

  function moyModule(m) {
    const ns = m.notes.filter(n => n.n != null && n.sur > 0 && n.coef > 0);
    const c = ns.reduce((s, n) => s + n.coef, 0);
    return c ? ns.reduce((s, n) => s + n.n / n.sur * 20 * n.coef, 0) / c : null;
  }
  function moyGenerale() {
    let s = 0, c = 0;
    data.modules.forEach(m => { const v = moyModule(m); if (v != null) { s += v * m.coef; c += m.coef; } });
    return { v: c ? s / c : null, coefs: c, total: data.modules.reduce((s, m) => s + m.coef, 0), nb: data.modules.filter(m => moyModule(m) != null).length };
  }

  // ---------- En-tête ----------
  function renderHead() {
    document.getElementById("who").textContent = `${data.eleve} · ${data.formation}`;
    document.getElementById("sem-label").textContent = `Moyenne générale · ${data.semestre}`;
    const g = moyGenerale();
    document.getElementById("general").innerHTML = g.v == null ? "—" : `${fmt(g.v)}<small>/20</small>`;
    document.getElementById("general-sub").textContent = g.nb
      ? `Calculée sur ${g.nb} module${g.nb > 1 ? "s" : ""} noté${g.nb > 1 ? "s" : ""} sur ${data.modules.length} (coefficients ${fmtN(g.coefs)} sur ${fmtN(g.total)})`
      : "Aucune note saisie pour l'instant";
  }

  // ---------- Onglet Notes ----------
  let message = { text: "", err: false, undo: false };
  let dernierSupprime = null;
  let confirmReset = false;
  let dernierModule = 0;
  let ajoutOuvert = null; // index du module dont le petit formulaire « + » est ouvert

  function renderNotes() {
    const opts = data.modules.map((m, i) => `<option value="${i}" ${i === dernierModule ? "selected" : ""}>${esc(m.nom)}</option>`).join("");
    const mods = data.modules.map((m, mi) => {
      const v = moyModule(m);
      const promo = m.promo ? `Promo ${fmt(m.promo.moy)} · min ${fmt(m.promo.min)} · max ${fmt(m.promo.max)}` : "";
      const rows = m.notes.map((n, i) => `
        <div class="note-row">
          <input id="e-${mi}-${i}-t" data-m="${mi}" data-i="${i}" data-k="t" value="${esc(n.t)}" aria-label="Intitulé">
          <input id="e-${mi}-${i}-n" class="num" data-m="${mi}" data-i="${i}" data-k="n" value="${n.n == null ? "" : fmtN(n.n)}" inputmode="decimal" aria-label="Note">
          <span class="sep">/</span>
          <input id="e-${mi}-${i}-sur" class="num" data-m="${mi}" data-i="${i}" data-k="sur" value="${fmtN(n.sur)}" inputmode="decimal" aria-label="Barème">
          ${s20(n.n, n.sur)}
          <span class="cl">coef <input id="e-${mi}-${i}-coef" class="num" style="width:2.6rem;display:inline-block" data-m="${mi}" data-i="${i}" data-k="coef" value="${fmtN(n.coef)}" inputmode="decimal" aria-label="Coefficient"></span>
          <button class="del" type="button" data-del="${mi}-${i}" title="Supprimer cette note" aria-label="Supprimer la note ${esc(n.t)}">×</button>
        </div>`).join("");
      return `
        <article class="mod" id="m-${code(m)}">
          <div class="mod-head">
            <div><div class="ref">${esc(m.ref)}</div>
              <div class="title-row"><h3>${esc(m.nom)}</h3><button class="plus" type="button" id="plus-${mi}" data-plus="${mi}" aria-expanded="${ajoutOuvert === mi}" title="Ajouter une note" aria-label="Ajouter une note en ${esc(m.nom)}">+</button></div>
              <div class="meta">coef. ${fmtN(m.coef)} · ${m.notes.length} note${m.notes.length > 1 ? "s" : ""}</div></div>
            <div class="mod-avg"><span class="v ${v == null ? "none" : v < 10 ? "lo" : ""}">${v == null ? "—" : fmt(v)}</span>${promo ? `<span class="promo">${promo}</span>` : ""}</div>
          </div>
          ${m.notes.length ? `<div class="notes">${rows}</div>` : ajoutOuvert === mi ? "" : '<p class="empty">Pas encore de note.</p>'}
          ${ajoutOuvert === mi ? `
          <form class="new-note" data-m="${mi}" novalidate>
            <div class="note-row">
              <input id="ia-t" placeholder="Intitulé (ex. DS 2)" aria-label="Intitulé" autocomplete="off">
              <input id="ia-n" class="num" placeholder="Note" inputmode="decimal" aria-label="Note" autocomplete="off">
              <span class="sep">/</span>
              <input id="ia-sur" class="num" value="20" inputmode="decimal" aria-label="Barème">
              <span class="s20" id="ia-s20" aria-live="polite"></span>
              <span class="cl">coef <input id="ia-coef" class="num" style="width:2.6rem;display:inline-block" value="1" inputmode="decimal" aria-label="Coefficient"></span>
              <span></span>
            </div>
            ${message.err ? `<p class="msg err">${esc(message.text)}</p>` : ""}
            <div class="new-actions"><button class="btn small" type="submit">Ajouter la note</button><button class="linkbtn" type="button" data-cancel="1">Annuler</button></div>
          </form>` : ""}
        </article>`;
    }).join("");

    return `
      <section class="add" aria-labelledby="h-add">
        <h2 id="h-add">Ajouter une note</h2>
        <form id="form-add" novalidate>
          <div class="field f-module"><label for="add-module">Module</label><select id="add-module">${opts}</select></div>
          <div class="field f-titre"><label for="add-titre">Intitulé</label><input id="add-titre" placeholder="Ex. Devoir surveillé 1" autocomplete="off"></div>
          <div class="field"><label for="add-note">Note</label><input id="add-note" inputmode="decimal" placeholder="14,5" autocomplete="off"></div>
          <div class="field"><label for="add-sur">Sur</label><input id="add-sur" inputmode="decimal" value="20"></div>
          <div class="field"><label for="add-coef">Coef.</label><input id="add-coef" inputmode="decimal" value="1"></div>
          <button class="btn" type="submit">Ajouter</button>
          <p class="preview" id="add-s20" aria-live="polite" style="grid-column: 1 / -1"></p>
        </form>
        <p class="msg ${message.err ? "err" : ""}" id="msg" aria-live="polite">${message.err && ajoutOuvert != null ? "" : esc(message.text)}${message.undo ? ' <button type="button" class="linkbtn" id="undo">Annuler</button>' : ""}</p>
      </section>
      <section aria-label="Modules">
        <p class="hint">Pour corriger une note, clique dessus et modifie-la directement. Tout est enregistré dans ce navigateur.</p>
        <div class="modules">${mods}</div>
      </section>
      <section aria-label="Sauvegarde">
        <div class="tools">
          <p class="hint">Les notes restent sur cet appareil. Exporte-les pour les garder ou les ouvrir sur un autre appareil.</p>
          <button class="btn ghost" type="button" id="export">Exporter mes notes</button>
          <button class="btn ghost" type="button" id="import">Importer un fichier</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
          <button class="btn danger" type="button" id="reset">${confirmReset ? "Confirmer : tout effacer ?" : "Revenir aux notes du bulletin"}</button>
        </div>
      </section>`;
  }

  // ---------- Onglet Graphiques ----------
  // Couleurs : moi = encre bleue (--accent), promo = orange (--s2), min/max = orange clair.
  const C_MOI = "var(--accent)", C_PROMO = "var(--s2)";
  const legendHTML = items => `<div class="legend">${items.join("")}</div>`;
  const lgLine = (color, label, dash) => `<span><i class="sw-line" style="border-color:${color}${dash ? ";border-top-style:dashed" : ""}"></i>${label}</span>`;
  const lgDot = (color, label, hollow) => `<span><i class="sw-dot" style="${hollow ? `border:2px solid ${color};background:transparent` : `background:${color}`}"></i>${label}</span>`;
  const lgRect = (label) => `<span><i class="sw-rect"></i>${label}</span>`;

  function lineChart() {
    const mods = data.modules;
    const W = 680, H = 320, L = 58, R = 12, T = 16, B = 40;
    const step = (W - L - R) / mods.length;
    const X = i => L + step * (i + 0.5);
    const Y = v => T + (1 - v / 20) * (H - T - B);
    let g = "";
    for (let v = 0; v <= 20; v += 2.5) {
      g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/>` +
           `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`;
    }
    g += `<line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="var(--rule-strong)"/><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--rule-strong)"/>`;
    g += `<text x="12" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">moyenne /20</text>`;
    mods.forEach((m, i) => {
      g += `<text x="${X(i)}" y="${H - B + 18}" text-anchor="middle">${code(m)}</text>`;
      // rectangle min-max de la promo
      if (m.promo && m.promo.min != null && m.promo.max != null) {
        const w = Math.min(28, step * 0.55), y1 = Y(m.promo.max), y0 = Y(m.promo.min);
        g += `<rect x="${X(i) - w / 2}" y="${y1}" width="${w}" height="${Math.max(2, y0 - y1)}" rx="2" fill="var(--range-fill)" stroke="var(--range-stroke)" stroke-width="1"><title>${esc(m.nom)} : promo de ${fmt(m.promo.min)} à ${fmt(m.promo.max)}</title></rect>`;
      }
      // chacune de mes notes
      m.notes.forEach(n => {
        if (n.n == null || !n.sur) return;
        g += `<circle cx="${X(i)}" cy="${Y(n.n / n.sur * 20)}" r="3.5" fill="var(--surface)" stroke="${C_MOI}" stroke-width="1.5" opacity=".8"><title>${esc(m.nom)} · ${esc(n.t)} : ${fmtN(n.n)}/${fmtN(n.sur)} (coef ${fmtN(n.coef)})</title></circle>`;
      });
    });
    const serie = (vals, color, marker, labels) => {
      const pts = vals.map((v, i) => v == null ? null : { x: X(i), y: Y(v), v, i }).filter(Boolean);
      let s = "";
      if (pts.length > 1) s += `<path d="${pts.map((p, k) => `${k ? "L" : "M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
      pts.forEach(p => {
        const tip = `<title>${esc(mods[p.i].nom)} : ${fmt(p.v)}/20</title>`;
        s += marker === "diamond"
          ? `<rect x="${p.x - 4.5}" y="${p.y - 4.5}" width="9" height="9" transform="rotate(45 ${p.x} ${p.y})" fill="${color}" stroke="var(--surface)" stroke-width="1.5">${tip}</rect>`
          : `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2">${tip}</circle>`;
        if (labels) {
          const pr = mods[p.i].promo ? mods[p.i].promo.moy : null;
          const below = pr != null && pr > p.v && pr - p.v < 3;
          s += `<text class="val" x="${p.x}" y="${below ? p.y + 20 : p.y - 10}" text-anchor="middle">${fmt(p.v)}</text>`;
        }
      });
      return s;
    };
    g += serie(mods.map(m => m.promo ? m.promo.moy : null), C_PROMO, "diamond", false);
    g += serie(mods.map(moyModule), C_MOI, "dot", true);
    return `
      <div class="card">
        <h2>Les moyennes par matière</h2>
        ${legendHTML([lgLine(C_MOI, "Ma moyenne"), lgDot(C_MOI, "Mes notes (sur 20)", true), lgLine(C_PROMO, "Moyenne de la promo"), lgRect("Min et max de la promo")])}
        <div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Moyennes par matière : la mienne, celle de la promo, et le minimum et le maximum de la promo">${g}</svg></div>
        <p class="hint">Axe horizontal : les matières, dans l'ordre du portail (${mods.map(m => `${code(m)} = ${esc(m.nom)}`).join(", ")}). Axe vertical : la moyenne sur 20.</p>
      </div>`;
  }

  function radarChart() {
    const mods = data.modules, N = mods.length;
    const S = 460, cx = S / 2, cy = S / 2, R = 150;
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;
    const P = (i, v) => [cx + Math.cos(ang(i)) * R * v / 20, cy + Math.sin(ang(i)) * R * v / 20];
    let g = "";
    [5, 10, 15, 20].forEach(v => {
      g += `<polygon points="${mods.map((_, i) => P(i, v).join(",")).join(" ")}" fill="none" stroke="${v === 20 ? "var(--rule-strong)" : "var(--rule)"}" stroke-width="1"/>`;
      const [lx, ly] = P(0, v); g += `<text x="${lx + 6}" y="${ly + 4}">${v}</text>`;
    });
    mods.forEach((m, i) => {
      const [x, y] = P(i, 20);
      g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>`;
      const [lx, ly] = P(i, 23.2), c = Math.cos(ang(i));
      g += `<text x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(c) < 0.2 ? "middle" : c > 0 ? "start" : "end"}">${code(m)}</text>`;
    });
    const serie = (vals, color, marker, fillOp) => {
      const pts = vals.map((v, i) => v == null ? null : { i, v, p: P(i, v) }).filter(Boolean);
      let s = "";
      if (pts.length >= 3) s += `<polygon points="${pts.map(q => q.p.join(",")).join(" ")}" fill="${color}" fill-opacity="${fillOp}" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
      else if (pts.length === 2) s += `<line x1="${pts[0].p[0]}" y1="${pts[0].p[1]}" x2="${pts[1].p[0]}" y2="${pts[1].p[1]}" stroke="${color}" stroke-width="2"/>`;
      pts.forEach(q => {
        const tip = `<title>${esc(mods[q.i].nom)} : ${fmt(q.v)}/20</title>`;
        s += marker === "diamond"
          ? `<rect x="${q.p[0] - 4.5}" y="${q.p[1] - 4.5}" width="9" height="9" transform="rotate(45 ${q.p[0]} ${q.p[1]})" fill="${color}" stroke="var(--surface)" stroke-width="1.5">${tip}</rect>`
          : `<circle cx="${q.p[0]}" cy="${q.p[1]}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2">${tip}</circle>`;
      });
      return s;
    };
    g += serie(mods.map(m => m.promo ? m.promo.moy : null), C_PROMO, "diamond", 0.08);
    g += serie(mods.map(moyModule), C_MOI, "dot", 0.12);
    return `
      <div class="card">
        <h2>Mon profil par matière</h2>
        ${legendHTML([lgLine(C_MOI, "Ma moyenne"), lgLine(C_PROMO, "Moyenne de la promo")])}
        <div class="radar-wrap"><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Graphique radar : une branche par matière, de 0 au centre à 20 au bord">${g}</svg></div>
        <p class="hint">Une branche par matière, de 0 au centre à 20 sur le bord. Une matière sans moyenne n'a pas de point : la forme se complète au fil des notes.</p>
      </div>`;
  }

  function renderCharts() { return `<section>${lineChart()}${radarChart()}</section>`; }

  // ---------- Rendu ----------
  const view = document.getElementById("view");
  function tab() { return location.hash === "#graphiques" ? "graphiques" : "notes"; }
  function render(focusId) {
    renderHead();
    const t = tab();
    ["notes", "graphiques"].forEach(n => {
      const a = document.getElementById("tab-" + n);
      if (n === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    view.innerHTML = t === "notes" ? renderNotes() : renderCharts();
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.select) el.select(); } }
  }
  const setMsg = (text, err = false, undo = false) => { message = { text, err, undo }; };

  view.addEventListener("submit", e => {
    if (e.target.classList.contains("new-note")) {
      e.preventDefault();
      const mi = +e.target.dataset.m;
      const t = document.getElementById("ia-t").value.trim() || "Note";
      const n = parse(document.getElementById("ia-n").value);
      const sur = parse(document.getElementById("ia-sur").value);
      const coef = parse(document.getElementById("ia-coef").value);
      const keep = () => { const vals = ["ia-t", "ia-n", "ia-sur", "ia-coef"].map(id => document.getElementById(id).value); return id => { render(id); ["ia-t", "ia-n", "ia-sur", "ia-coef"].forEach((k, j) => { const el = document.getElementById(k); if (el) el.value = vals[j]; }); document.getElementById(id).focus(); }; };
      if (n == null) { setMsg("Entre une note, par exemple 14,5.", true); return keep()("ia-n"); }
      if (!sur || sur <= 0) { setMsg("Le barème doit être un nombre positif, par exemple 20.", true); return keep()("ia-sur"); }
      if (n < 0 || n > sur) { setMsg(`La note doit être comprise entre 0 et ${fmtN(sur)}.`, true); return keep()("ia-n"); }
      if (coef == null || coef <= 0) { setMsg("Le coefficient doit être un nombre positif, par exemple 1.", true); return keep()("ia-coef"); }
      data.modules[mi].notes.push({ t, n, sur, coef });
      save(); ajoutOuvert = null;
      setMsg(`Ajouté : ${fmtN(n)}/${fmtN(sur)}${sur === 20 ? "" : `, soit ${fmt(n / sur * 20)}/20`} (coef ${fmtN(coef)}) en ${data.modules[mi].nom}.`);
      render("plus-" + mi);
      return;
    }
    if (e.target.id !== "form-add") return;
    e.preventDefault();
    const mi = +document.getElementById("add-module").value;
    const t = document.getElementById("add-titre").value.trim() || "Note";
    const n = parse(document.getElementById("add-note").value);
    const sur = parse(document.getElementById("add-sur").value);
    const coef = parse(document.getElementById("add-coef").value);
    dernierModule = mi;
    if (n == null) { setMsg("Entre une note, par exemple 14,5.", true); return render("add-note"); }
    if (!sur || sur <= 0) { setMsg("Le barème doit être un nombre positif, par exemple 20.", true); return render("add-sur"); }
    if (n < 0 || n > sur) { setMsg(`La note doit être comprise entre 0 et ${fmtN(sur)}.`, true); return render("add-note"); }
    if (coef == null || coef <= 0) { setMsg("Le coefficient doit être un nombre positif, par exemple 1.", true); return render("add-coef"); }
    data.modules[mi].notes.push({ t, n, sur, coef });
    save();
    setMsg(`Ajouté : ${fmtN(n)}/${fmtN(sur)}${sur === 20 ? "" : `, soit ${fmt(n / sur * 20)}/20`} en ${data.modules[mi].nom}.`);
    render("add-titre");
  });

  view.addEventListener("change", e => {
    const el = e.target; if (!el.dataset || el.dataset.k == null) return;
    const n = data.modules[+el.dataset.m].notes[+el.dataset.i];
    const k = el.dataset.k;
    if (k === "t") n.t = el.value.trim() || "Note";
    else {
      const v = parse(el.value);
      const ok = v != null && (k === "n" ? v >= 0 && v <= n.sur : v > 0) && !(k === "sur" && v < n.n);
      if (!ok) { setMsg(k === "n" ? `Note invalide : elle doit être entre 0 et ${fmtN(n.sur)}.` : "Valeur invalide : entre un nombre positif.", true); render(el.id); return; }
      n[k] = v;
    }
    save(); setMsg("Modification enregistrée.");
    setTimeout(() => render(document.activeElement && document.activeElement.id), 0);
  });

  view.addEventListener("click", e => {
    const plus = e.target.closest("[data-plus]");
    if (plus) {
      const mi = +plus.dataset.plus;
      ajoutOuvert = ajoutOuvert === mi ? null : mi; setMsg("");
      render(ajoutOuvert === mi ? "ia-t" : "plus-" + mi);
      return;
    }
    if (e.target.closest("[data-cancel]")) { const mi = ajoutOuvert; ajoutOuvert = null; setMsg(""); render("plus-" + mi); return; }
    const del = e.target.closest("[data-del]");
    if (del) {
      const [mi, i] = del.dataset.del.split("-").map(Number);
      const [n] = data.modules[mi].notes.splice(i, 1);
      dernierSupprime = { mi, i, n };
      save(); setMsg(`Note supprimée : ${n.t} (${data.modules[mi].nom}).`, false, true); render("undo");
      return;
    }
    if (e.target.id === "undo" && dernierSupprime) {
      const { mi, i, n } = dernierSupprime; data.modules[mi].notes.splice(i, 0, n); dernierSupprime = null;
      save(); setMsg("Suppression annulée."); render();
      return;
    }
    if (e.target.id === "export") {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "mes-notes.json"; document.body.appendChild(a); a.click(); a.remove();
      setMsg("Fichier mes-notes.json téléchargé."); render(); return;
    }
    if (e.target.id === "import") { document.getElementById("import-file").click(); return; }
    if (e.target.id === "reset") {
      if (!confirmReset) { confirmReset = true; render("reset"); setTimeout(() => { if (confirmReset) { confirmReset = false; if (tab() === "notes") render(); } }, 5000); return; }
      confirmReset = false; data = copie(DEFAUT); save(); setMsg("Notes remises comme sur le bulletin."); render(); return;
    }
  });

  view.addEventListener("change", e => {
    if (e.target.id !== "import-file" || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.modules)) throw new Error();
        data = d; save(); setMsg("Notes importées.");
      } catch (err) { setMsg("Ce fichier n'est pas un export de ce site (mes-notes.json).", true); }
      render();
    };
    r.readAsText(e.target.files[0]);
  });

  // Aperçu en direct de la note ramenée sur 20 pendant la saisie
  view.addEventListener("input", e => {
    const pairs = { "ia-n": ["ia-n", "ia-sur", "ia-s20"], "ia-sur": ["ia-n", "ia-sur", "ia-s20"], "add-note": ["add-note", "add-sur", "add-s20"], "add-sur": ["add-note", "add-sur", "add-s20"] };
    const pr = pairs[e.target.id]; if (!pr) return;
    const n = parse(document.getElementById(pr[0]).value), sur = parse(document.getElementById(pr[1]).value);
    const v = n != null && sur > 0 && n <= sur ? sur20(n, sur) : null;
    const out = document.getElementById(pr[2]);
    out.textContent = v == null || sur === 20 ? "" : (pr[2] === "add-s20" ? `Soit ${fmt(v)}/20 dans la moyenne.` : `= ${fmt(v)}/20`);
    out.classList.toggle("lo", v != null && v < 10 && pr[2] !== "add-s20");
  });

  window.addEventListener("hashchange", () => render());
  render();
  // Application installable : fonctionne aussi hors connexion
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
